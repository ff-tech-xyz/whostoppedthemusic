name: Verify Who Stopped The Music

on:
  push:
    branches: ['update/1.2.0', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whostoppedthemusic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - name: Build the installable artifact and run unit tests
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean build gametestClasses --console=plain
          mkdir -p build/evidence
          sha256sum build/libs/whostoppedthemusic-1.2.0.jar > build/evidence/artifact.sha256
      - name: Exercise packaged client features
        run: |
          set -euo pipefail
          for selection in default transportOnly basicOnly basicUiOnly discoveryOnly customOnly customUiOnly biomeUiOnly toggleOnly previewOnly controlsOnly artworkOnly menuOnly ownSongsOnly addSongsOnly; do
            evidence="build/evidence/$selection"
            mkdir -p "$evidence"
            args=()
            if [ "$selection" != default ]; then args+=("-P$selection"); fi
            xvfb-run -a ./gradlew --no-daemon runClientGameTest "${args[@]}" --console=plain 2>&1 | tee "$evidence/client.log"
            cp build/evidence/client-classes.log "$evidence/classes.log"
            cp -r run/clientGameTest/screenshots "$evidence/"
            sha256sum -c build/evidence/artifact.sha256
          done
      - name: Retain the tested JAR and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whostoppedthemusic-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/libs/*.jar
            build/test-results/test/*.xml
            build/reports/tests/
            build/evidence/
