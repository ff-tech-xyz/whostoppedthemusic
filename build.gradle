plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

layout.buildDirectory = file('../../runtime/whostoppedthemusic/build')

loom {
    clientOnlyMinecraftJar()
    mods {
        whostoppedthemusic {
            sourceSet sourceSets.main
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'whostoppedthemusic-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}

// configureTests supplies a checkout-local default; keep disposable data outside source.
loom.runs.configureEach {
    runDirectory.set(file("../../runtime/whostoppedthemusic/run/${name}"))
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "dev.mccue:jlayer-decoder:${project.jlayer_version}"
    include "dev.mccue:jlayer-decoder:${project.jlayer_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.named('test') {
    useJUnitPlatform()
    def testTemp = file('../../runtime/whostoppedthemusic/test-temp')
    systemProperty 'java.io.tmpdir', testTemp.absolutePath
    doFirst { testTemp.mkdirs() }
}

tasks.named('processResources') {
    def metadata = [version: project.version, minecraft_version: project.minecraft_version,
                    loader_version: project.loader_version, fabric_api_version: project.fabric_api_version]
    inputs.properties metadata
    filesMatching('fabric.mod.json') {
        expand metadata
    }
}

tasks.named('jar') {
    from('LICENSE') {
        rename { "LICENSE_${project.archives_base_name}" }
    }
    from('LICENSE_jlayer')
}

// Exercise the installable artifact, not an equivalent set of source outputs.
tasks.named('runClientGameTest') {
    dependsOn tasks.named('jar'), tasks.named('gametestClasses')
    classpath = files(classpath.files).minus(sourceSets.main.output)
            .plus(files(tasks.named('jar').flatMap { it.archiveFile }))
    jvmArgs "-Xlog:class+load=info:file=${file('../../runtime/whostoppedthemusic/evidence/client-classes.log')}"
    doFirst { file('../../runtime/whostoppedthemusic/evidence').mkdirs() }
}
